name: Generate and Publish Reentry Datasource

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * 1'

jobs:
  generate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pip install tableauhyperapi tableauserverclient

      - name: Generate CSV
        run: python generate_reentry_data.py

